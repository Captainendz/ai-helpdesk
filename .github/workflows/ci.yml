name: AI Helpdesk CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Imports
        run: |
          python -c "from ai.classifier import classify_issue"
          python -c "from rag.document_rag import search_documents"
          python -c "from api.glpi_api import create_ticket"

      - name: Success Message
        run: echo "CI pipeline passed successfully."